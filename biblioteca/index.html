<!doctype html>
<html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Biblioteca Digital GMV</title>
<style>body{margin:0;background:#f3f6f8;color:#08253e;font:16px Arial,sans-serif}header{background:#08253e;color:white;padding:24px}main{max-width:1100px;margin:auto;padding:24px}h1,h2{font-family:Georgia,serif}button,input{font:inherit;padding:10px;margin:4px;border:1px solid #8798a5;border-radius:5px}button{background:#08253e;color:white;cursor:pointer}button:disabled{opacity:.5}#catalog,#owned{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}article,section{background:white;padding:20px;border-radius:8px;margin-bottom:16px}article img{height:180px;max-width:100%;object-fit:contain}#body{white-space:pre-wrap;font:19px/1.8 Georgia,serif;max-width:72ch;margin:auto;overflow-wrap:anywhere}#watermark{color:#687782;font-size:12px}a{color:inherit}#status{min-height:24px}</style>
<header><a href="../libros.html">GMV · Libros</a><h1>Biblioteca Digital GMV</h1>Conocimiento inmobiliario para comprender, decidir y actuar.</header>
<main><p id="status" role="status" aria-live="polite">Iniciando biblioteca de pruebas…</p><section><form id="login"><label>Correo electrónico <input type="email" id="email" required autocomplete="email"></label><button>Recibir enlace de acceso</button></form><button id="logout" hidden>Cerrar sesión</button></section><h2>Catálogo</h2><div id="catalog"></div><h2>Mi biblioteca</h2><div id="owned"></div><section id="reader" hidden><button id="close">Cerrar lectura</button><h2 id="booktitle"></h2><div id="flipbook"></div></section></main>
<script type="module">
import {createReader} from "./reader.js";
const $=id=>document.getElementById(id), status=t=>$('status').textContent=t;
let db, session, flipbook, generation=0, readerGeneration=0, signingOut=false;
const clearReader=()=>{readerGeneration++;flipbook?.close();$('reader').hidden=true;$('booktitle').textContent=''};
const rpc=async(name,args={})=>{const {data,error}=await db.rpc(name,args);if(error)throw error;return data||[]};
function card(b,owned){const a=document.createElement('article');if(b.cover_url){try{const u=new URL(b.cover_url,location.origin);if(u.protocol==='https:'||u.origin===location.origin){const img=document.createElement('img');img.src=u.href;img.alt='Portada';a.append(img)}}catch{}}const h=document.createElement('h3');h.textContent=b.title;a.append(h);const p=document.createElement('p');p.textContent=b.description||'';a.append(p);const btn=document.createElement('button');btn.textContent=owned?'Leer':b.access_mode==='free'?'Acceso con registro':b.access_mode==='paid'?'Compra aún no habilitada':'Acceso autorizado';btn.disabled=!owned;btn.onclick=()=>void openBook(b);a.append(btn);return a}
async function refresh(){const g=++generation;const {data,error}=await db.auth.getSession();if(error)throw error;if(g!==generation)return;session=data.session;$('login').hidden=!!session;$('logout').hidden=!session;const catalog=await rpc('gmv_catalog');const owned=session?await rpc('gmv_my_books'):[];if(g!==generation)return;const ids=new Set(owned.map(b=>b.id));$('catalog').replaceChildren(...catalog.map(b=>card(b,ids.has(b.id))));$('owned').replaceChildren(...owned.map(b=>card(b,true)));status(session?'Sesión iniciada.':'Registrate para acceder a las publicaciones gratuitas.')}
async function openBook(b){if(signingOut)return;clearReader();const g=readerGeneration;try{const {data,error}=await db.auth.getSession();if(g!==readerGeneration||signingOut)return;if(error||!data.session)throw Error('Authentication required');$('booktitle').textContent=b.title;$('reader').hidden=false;await flipbook.open(b.id,data.session)}catch{if(g===readerGeneration){clearReader();status('No se pudo abrir el libro.')}}}
$('close').onclick=clearReader;
try{const config=await fetch('./config.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error();return r.json()});if(!config.url||!config.publishableKey)throw Error();const {createClient}=await import('https://esm.sh/@supabase/supabase-js@2.49.4');db=createClient(config.url,config.publishableKey);flipbook=createReader(db,$("flipbook"));$('login').onsubmit=async e=>{e.preventDefault();const {error}=await db.auth.signInWithOtp({email:$('email').value,emailRedirectTo:location.origin+location.pathname});status(error?'No se pudo enviar el enlace.':'Revisá tu correo para ingresar.')};$('logout').onclick=async()=>{if(signingOut)return;signingOut=true;generation++;clearReader();$('owned').replaceChildren();$('catalog').replaceChildren();try{const {error}=await db.auth.signOut();if(error)throw error;await refresh()}catch{status('No se pudo cerrar sesión.')}finally{signingOut=false}};db.auth.onAuthStateChange((event,newSession)=>{if(event==='SIGNED_OUT'||(session&&session.user.id!==newSession?.user?.id)){generation++;clearReader();$('owned').replaceChildren();$('catalog').replaceChildren()}setTimeout(()=>refresh().catch(()=>status('No se pudo actualizar la biblioteca.')),0)});await refresh()}catch{$('login').hidden=true;status('Entorno de pruebas sin configuración. No se habilitan lecturas ni pagos.')}
</script></html>
