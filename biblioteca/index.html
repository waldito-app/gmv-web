<!doctype html>
<html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Biblioteca Digital GMV</title>
<style>body{margin:0;background:#f3f6f8;color:#08253e;font:16px Arial,sans-serif}header{background:#08253e;color:white;padding:24px}main{max-width:1100px;margin:auto;padding:24px}h1,h2{font-family:Georgia,serif}button,input{font:inherit;padding:10px;margin:4px;border:1px solid #8798a5;border-radius:5px}button{background:#08253e;color:white;cursor:pointer}button:disabled{opacity:.5}#catalog,#owned{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}article,section{background:white;padding:20px;border-radius:8px;margin-bottom:16px}article img{height:180px;max-width:100%;object-fit:contain}#body{white-space:pre-wrap;font:19px/1.8 Georgia,serif;max-width:72ch;margin:auto;overflow-wrap:anywhere}#watermark{color:#687782;font-size:12px}a{color:inherit}#status{min-height:24px}</style>
<header><a href="../libros.html">GMV · Libros</a><h1>Biblioteca Digital GMV</h1>Conocimiento inmobiliario para comprender, decidir y actuar.</header>
<main><p id="status" role="status" aria-live="polite">Iniciando biblioteca de pruebas…</p><section><form id="login"><label>Correo electrónico <input type="email" id="email" required autocomplete="email"></label><button>Recibir enlace de acceso</button></form><button id="logout" hidden>Cerrar sesión</button></section><h2>Catálogo</h2><div id="catalog"></div><h2>Mi biblioteca</h2><div id="owned"></div><section id="reader" hidden><button id="close">Cerrar lectura</button><h2 id="booktitle"></h2><label>Capítulo <select id="toc"></select></label><p id="watermark"></p><h2 id="chaptertitle"></h2><div id="body"></div></section></main>
<script type="module">
const $=id=>document.getElementById(id), status=t=>$('status').textContent=t;
let db, session, book, generation=0;
const clearReader=()=>{generation++;book=null;$('reader').hidden=true;$('body').textContent='';$('chaptertitle').textContent='';$('watermark').textContent='';$('toc').replaceChildren()};
const rpc=async(name,args={})=>{const {data,error}=await db.rpc(name,args);if(error)throw error;return data||[]};
function card(b,owned){const a=document.createElement('article');if(b.cover_url){try{const u=new URL(b.cover_url,location.origin);if(u.protocol==='https:'||u.origin===location.origin){const img=document.createElement('img');img.src=u.href;img.alt='Portada';a.append(img)}}catch{}}const h=document.createElement('h3');h.textContent=b.title;a.append(h);const p=document.createElement('p');p.textContent=b.description||'';a.append(p);const btn=document.createElement('button');btn.textContent=owned?'Leer':b.access_mode==='free'?'Acceso con registro':b.access_mode==='paid'?'Compra aún no habilitada':'Acceso autorizado';btn.disabled=!owned;btn.onclick=()=>openBook(b).catch(()=>{clearReader();status('No se pudo abrir el libro.')});a.append(btn);return a}
async function refresh(){const g=++generation;const {data,error}=await db.auth.getSession();if(error)throw error;if(g!==generation)return;session=data.session;$('login').hidden=!!session;$('logout').hidden=!session;const catalog=await rpc('gmv_catalog');const owned=session?await rpc('gmv_my_books'):[];if(g!==generation)return;const ids=new Set(owned.map(b=>b.id));$('catalog').replaceChildren(...catalog.map(b=>card(b,ids.has(b.id))));$('owned').replaceChildren(...owned.map(b=>card(b,true)));status(session?'Sesión iniciada.':'Registrate para acceder a las publicaciones gratuitas.')}
async function openBook(b){clearReader();book=b;const g=generation;const toc=await rpc('gmv_toc',{p_book:b.id});if(g!==generation)return;if(!toc.length){clearReader();status('No hay capítulos disponibles o no tenés acceso.');return}$('booktitle').textContent=b.title;$('watermark').textContent='Lectura personal · '+(session?.user?.email||'');$('toc').replaceChildren(...toc.map(c=>{const o=document.createElement('option');o.value=c.ordinal;o.textContent=c.title;return o}));$('reader').hidden=false;await read()}
async function read(){if(!book)return;const g=++generation;$('body').textContent='';$('chaptertitle').textContent='';const rows=await rpc('gmv_chapter',{p_book:book.id,p_ordinal:Number($('toc').value)});if(g!==generation)return;if(!rows.length){clearReader();status('Acceso no disponible.');return}$('chaptertitle').textContent=rows[0].title;$('body').textContent=rows[0].body_text}
$('close').onclick=clearReader;$('toc').onchange=()=>read().catch(()=>{clearReader();status('No se pudo cargar el capítulo.')});
try{const config=await fetch('./config.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error();return r.json()});if(!config.url||!config.publishableKey)throw Error();const {createClient}=await import('https://esm.sh/@supabase/supabase-js@2.49.4');db=createClient(config.url,config.publishableKey);$('login').onsubmit=async e=>{e.preventDefault();const {error}=await db.auth.signInWithOtp({email:$('email').value,emailRedirectTo:location.origin+location.pathname});status(error?'No se pudo enviar el enlace.':'Revisá tu correo para ingresar.')};$('logout').onclick=async()=>{clearReader();$('owned').replaceChildren();$('catalog').replaceChildren();const {error}=await db.auth.signOut();if(error)status('No se pudo cerrar sesión.');else await refresh()};db.auth.onAuthStateChange(event=>{if(event==='SIGNED_OUT'){clearReader();$('owned').replaceChildren();$('catalog').replaceChildren()}setTimeout(()=>refresh().catch(()=>status('No se pudo actualizar la biblioteca.')),0)});await refresh()}catch{$('login').hidden=true;status('Entorno de pruebas sin configuración. No se habilitan lecturas ni pagos.')}
</script></html>
